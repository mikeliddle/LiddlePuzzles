name: Android PR smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  readme:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Keep the download prominent and developer detail out of README
        run: |
          head -n 15 README.md | grep -F 'https://github.com/mikeliddle/LiddlePuzzles/releases/latest' > /dev/null
          if grep -Eq '^```|^[#]+ .*([Bb]uild|[Tt]esting|[Ii]nstallation|[Dd]evelopment)' README.md; then
            echo 'Move setup, build, and testing instructions to docs/DEVELOPMENT.md.' >&2
            exit 1
          fi
  instrumentation:
    name: Android API ${{ matrix.api }} smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            revision: '13(\.0)*'
          - api: 35
            revision: '9(\.0)*'
    env:
      SUDOKU_SIGNING_DIR: ${{ github.workspace }}/.ci-no-release-key
      TARGET_PACKAGE: fyi.mllab.puzzle.validation
      ANDROID_SERIAL: emulator-5554
      SYSTEM_IMAGE: system-images;android-${{ matrix.api }};google_apis;x86_64
      SYSTEM_IMAGE_REVISION: ${{ matrix.revision }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'
      - name: Check wrapper and prepare hosted Android tools
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          test ! -e "$SUDOKU_SIGNING_DIR"
          # SDK packages come from Google's SDK repository. Revisions below were
          # reviewed in repository2-3.xml and google_apis/sys-img2-1.xml.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=0 "cmdline-tools;23.0" < <(yes)
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --channel=0 \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
            "emulator" "$SYSTEM_IMAGE" < <(yes)
          assert_revision() {
            local properties="$ANDROID_HOME/$1/source.properties"
            if ! grep -Eq "^Pkg.Revision[[:space:]]*=[[:space:]]*$2[[:space:]]*$" "$properties"; then
              echo "Unreviewed SDK revision: $1. Review Google's metadata before updating this pin." >&2
              exit 1
            fi
          }
          # Mutable SDK identifiers fail closed instead of silently updating CI.
          assert_revision cmdline-tools/23.0 '23(\.0)*'
          assert_revision platforms/android-36 '2(\.0)*'
          assert_revision build-tools/36.0.0 '36\.0\.0'
          assert_revision platform-tools '37\.0\.3'
          assert_revision emulator '37\.3\.10'
          assert_revision "system-images/android-${{ matrix.api }}/google_apis/x86_64" "$SYSTEM_IMAGE_REVISION"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Compile validation app and instrumentation
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/smoke-gradle
        run: |
          for attempt in 1 2; do
            if bash ./gradlew --no-daemon --console=plain --dependency-verification strict \
              -PunsignedRelease=true engineTest :app:assembleValidation :app:assembleValidationAndroidTest :app:lintValidation :app:assembleRelease \
              2>&1 | tee "$RUNNER_TEMP/smoke-gradle.log"; then
              break
            fi
            if [[ "$attempt" == 2 ]] || ! grep -Eq 'Could not GET .*https://repo\.maven\.apache\.org/.*status code 429' "$RUNNER_TEMP/smoke-gradle.log"; then
              exit 1
            fi
            echo 'Maven Central rate limited dependency resolution; retrying once after 60 seconds.'
            sleep 60
          done
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt2" dump badging app/build/outputs/apk/validation/app-validation.apk > validation-manifest.txt
          grep -Eq "^package: name='fyi\.mllab\.puzzle\.validation' " validation-manifest.txt
          if grep -q 'uses-permission' validation-manifest.txt; then
            echo 'Validation app must remain offline and permission-free.' >&2
            exit 1
          fi
          "$TOOLS/aapt2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk > release-manifest.txt
          grep -Eq "^package: name='fyi\.mllab\.puzzle' " release-manifest.txt
          if grep -Eq 'uses-permission|application-debuggable' release-manifest.txt; then exit 1; fi
          for variant in validation release; do
            if [[ "$variant" == validation ]]; then
              apk=app/build/outputs/apk/validation/app-validation.apk
              scheme=liddlepuzzles-local
              scheme_count=2
            else
              apk=app/build/outputs/apk/release/app-release-unsigned.apk
              scheme=liddlepuzzles
              scheme_count=3
            fi
            "$TOOLS/aapt2" dump xmltree "$apk" --file AndroidManifest.xml > "$variant-routes.txt"
            test "$(grep -c 'android:scheme(' "$variant-routes.txt")" -eq "$scheme_count"
            test "$(grep -cF "=\"$scheme\"" "$variant-routes.txt")" -eq 2
            test "$(grep -cF '="/v1/"' "$variant-routes.txt")" -eq 2
            for mode in sudoku takuzu nonogram futoshiki numberlink slitherlink daily-word; do
              grep -E "android:host.*=\"$mode\"" "$variant-routes.txt" > /dev/null
            done
            if [[ "$variant" == release ]]; then
              grep -Eq 'android:autoVerify\([^)]*\)=true' "$variant-routes.txt"
              grep -Eq 'android:scheme\([^)]*\)="https"' "$variant-routes.txt"
              grep -Eq 'android:host\([^)]*\)="mllab\.fyi"' "$variant-routes.txt"
              grep -Eq 'android:path\([^)]*\)="/liddle-puzzles/share/"' "$variant-routes.txt"
            elif grep -Eq 'android:autoVerify|mllab\.fyi|="/liddle-puzzles/share/"' "$variant-routes.txt"; then
              exit 1
            fi
          done
          "$TOOLS/aapt2" dump badging app/build/outputs/apk/androidTest/validation/app-validation-androidTest.apk > test-manifest.txt
          grep -Eq "^package: name='fyi\.mllab\.puzzle\.validation\.test' " test-manifest.txt
      - name: Boot an isolated headless emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/smoke-avd
        run: |
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/23.0/bin/avdmanager" create avd \
            --force --name ci-smoke --path "$ANDROID_AVD_HOME/ci-smoke.avd" \
            --package "$SYSTEM_IMAGE" --device pixel_2 <<< no
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx ci-smoke
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd ci-smoke -port 5554 -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader -accel on > emulator.log 2>&1 &
          emulator_pid=$!
          echo "EMULATOR_PID=$emulator_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo 'Emulator exited before boot.' >&2
              tail -100 emulator.log
              exit 1
            fi
            if [[ "$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              adb shell input keyevent 82
              adb shell settings put global window_animation_scale 0
              adb shell settings put global transition_animation_scale 0
              adb shell settings put global animator_duration_scale 0
              exit 0
            fi
            sleep 2
          done
          tail -100 emulator.log
          echo 'Emulator boot timed out.' >&2
          exit 1
      - name: Run repeatable generated-game smoke tests
        run: |
          adb install -r app/build/outputs/apk/validation/app-validation.apk
          adb install -r app/build/outputs/apk/androidTest/validation/app-validation-androidTest.apk
          for repetition in 1 2; do
            adb shell pm clear "$TARGET_PACKAGE" | tr -d '\r' | grep -Fx Success
            if ! timeout 180 adb shell am instrument -w -r \
              -e class com.quietgrid.sudoku.CiSmokeTests,com.quietgrid.sudoku.PersistenceDeviceTests,com.quietgrid.sudoku.SharingDeviceTests,com.quietgrid.sudoku.MultiSharingDeviceTests \
              "$TARGET_PACKAGE.test/android.test.InstrumentationTestRunner" | tee "smoke-$repetition.txt"; then
              adb logcat -b crash -d -t 100 || true
              exit 1
            fi
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' "smoke-$repetition.txt"; then
              adb logcat -b crash -d -t 100 || true
              exit 1
            fi
            grep -Eq '^OK \(26 tests\)' "smoke-$repetition.txt"
          done
      - name: Stop the emulator
        if: always()
        run: |
          if [[ -n "${EMULATOR_PID:-}" ]]; then
            adb emu kill || true
            kill "$EMULATOR_PID" 2>/dev/null || true
          fi
