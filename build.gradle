plugins {
    id 'com.android.application' version '8.13.0' apply false
}

tasks.register('compileEngineTests', JavaCompile) {
    source = files(
        'app/src/main/java/com/quietgrid/sudoku/Sudoku.java',
        'app/src/main/java/com/quietgrid/sudoku/Game.java',
        'app/src/main/java/com/quietgrid/sudoku/PuzzleLibrary.java',
        'app/src/main/java/com/quietgrid/sudoku/PuzzleJson.java',
        'app/src/main/java/com/quietgrid/sudoku/DailyWord.java',
        'app/src/main/java/com/quietgrid/sudoku/ActivePlayTimer.java',
        'app/src/test/java/com/quietgrid/sudoku/EngineTests.java',
        'app/src/test/java/com/quietgrid/sudoku/CurationTests.java',
        'app/src/test/java/com/quietgrid/sudoku/DifficultyTests.java',
        'app/src/test/java/com/quietgrid/sudoku/DailyWordTests.java',
        'app/src/test/java/com/quietgrid/sudoku/PuzzleTests.java',
        'app/src/test/java/com/quietgrid/sudoku/ClassificationBatch.java',
        'app/src/test/java/com/quietgrid/sudoku/EasyGenerationBatch.java'
    )
    source fileTree('app/src/main/java/com/quietgrid/sudoku/puzzles') { include '*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('engine-tests')
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

tasks.register('puzzleTest', JavaExec) {
    dependsOn 'compileEngineTests'
    classpath = files(layout.buildDirectory.dir('engine-tests'))
    mainClass = 'com.quietgrid.sudoku.PuzzleTests'
    args layout.projectDirectory.dir('dist/six-puzzles-20261117').asFile.absolutePath
}

tasks.register('engineTest', JavaExec) {
    dependsOn 'compileEngineTests'
    classpath = files(layout.buildDirectory.dir('engine-tests'))
    mainClass = 'com.quietgrid.sudoku.EngineTests'
}

tasks.register('classificationBatch', JavaExec) {
    dependsOn 'compileEngineTests'
    classpath = files(layout.buildDirectory.dir('engine-tests'))
    mainClass = 'com.quietgrid.sudoku.ClassificationBatch'
    args layout.projectDirectory.dir('dist/puzzle-classification-20261111').asFile.absolutePath
}

tasks.register('easyGenerationBatch', JavaExec) {
    dependsOn 'compileEngineTests'
    classpath = files(layout.buildDirectory.dir('engine-tests'))
    mainClass = 'com.quietgrid.sudoku.EasyGenerationBatch'
    args layout.projectDirectory.dir('dist/easy-generation-20261116').asFile.absolutePath,
            providers.gradleProperty('easyBatchStage').orElse('after').get()
}
