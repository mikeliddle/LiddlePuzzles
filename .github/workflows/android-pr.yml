name: Android PR smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  instrumentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUDOKU_SIGNING_DIR: ${{ github.workspace }}/.ci-no-release-key
      TARGET_PACKAGE: fyi.mllab.puzzle.validation
      ANDROID_SERIAL: emulator-5554
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'
      - name: Check wrapper and prepare hosted Android tools
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
          test ! -e "$SUDOKU_SIGNING_DIR"
          # SDK packages come from Google's SDK repository. Revisions below were
          # reviewed in repository2-1.xml and google_apis/sys-img2-1.xml.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=0 "cmdline-tools;23.0" < <(yes)
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --channel=0 \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" \
            "emulator" "system-images;android-35;google_apis;x86_64" < <(yes)
          assert_revision() {
            local properties="$ANDROID_HOME/$1/source.properties"
            if ! grep -Eq "^Pkg.Revision[[:space:]]*=[[:space:]]*$2[[:space:]]*$" "$properties"; then
              echo "Unreviewed SDK revision: $1. Review Google's metadata before updating this pin." >&2
              exit 1
            fi
          }
          # Mutable SDK identifiers fail closed instead of silently updating CI.
          assert_revision cmdline-tools/23.0 '23(\.0)*'
          assert_revision platforms/android-36 '2(\.0)*'
          assert_revision build-tools/36.0.0 '36\.0\.0'
          assert_revision platform-tools '37\.0\.3'
          assert_revision emulator '37\.3\.10'
          assert_revision system-images/android-35/google_apis/x86_64 '9(\.0)*'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Compile validation app and instrumentation
        run: |
          bash ./gradlew --no-daemon --console=plain --dependency-verification strict \
            -PunsignedRelease=true engineTest :app:assembleValidation :app:assembleValidationAndroidTest :app:lintValidation
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt2" dump badging app/build/outputs/apk/validation/app-validation.apk > validation-manifest.txt
          grep -Eq "^package: name='fyi\.mllab\.puzzle\.validation' " validation-manifest.txt
          if grep -q 'uses-permission' validation-manifest.txt; then
            echo 'Validation app must remain offline and permission-free.' >&2
            exit 1
          fi
          "$TOOLS/aapt2" dump badging app/build/outputs/apk/androidTest/validation/app-validation-androidTest.apk > test-manifest.txt
          grep -Eq "^package: name='fyi\.mllab\.puzzle\.validation\.test' " test-manifest.txt
      - name: Boot an isolated headless emulator
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          "$ANDROID_HOME/cmdline-tools/23.0/bin/avdmanager" create avd \
            --force --name ci-smoke --package "system-images;android-35;google_apis;x86_64" --device pixel_2 <<< no
          emulator -avd ci-smoke -port 5554 -no-window -no-audio -no-boot-anim \
            -no-snapshot -wipe-data -gpu swiftshader -accel on > emulator.log 2>&1 &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"
          timeout 240 adb wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            tail -100 emulator.log
            echo 'Emulator boot timed out.' >&2
            exit 1
          fi
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Run repeatable generated-game smoke tests
        run: |
          adb install -r app/build/outputs/apk/validation/app-validation.apk
          adb install -r app/build/outputs/apk/androidTest/validation/app-validation-androidTest.apk
          for repetition in 1 2; do
            adb shell pm clear "$TARGET_PACKAGE" | tr -d '\r' | grep -Fx Success
            timeout 180 adb shell am instrument -w -r \
              -e class com.quietgrid.sudoku.CiSmokeTests,com.quietgrid.sudoku.PersistenceDeviceTests \
              "$TARGET_PACKAGE.test/android.test.InstrumentationTestRunner" | tee "smoke-$repetition.txt"
            if grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_ABORTED|shortMsg=|Process crashed' "smoke-$repetition.txt"; then
              exit 1
            fi
            grep -Eq '^OK \(8 tests\)' "smoke-$repetition.txt"
          done
      - name: Stop the emulator
        if: always()
        run: |
          if [[ -n "${EMULATOR_PID:-}" ]]; then
            adb emu kill || true
            kill "$EMULATOR_PID" 2>/dev/null || true
          fi
