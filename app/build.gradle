plugins {
    id 'com.android.application'
}

def unsignedRelease = providers.gradleProperty('unsignedRelease').orNull
if (unsignedRelease != null && unsignedRelease != 'true') {
    throw new GradleException('unsignedRelease must be explicitly true, or omitted for a signed local release.')
}
def signingPath = System.getenv('SUDOKU_SIGNING_DIR')
def localAppData = System.getenv('LOCALAPPDATA')
def signingDirectory = signingPath
        ? new File(signingPath)
        : localAppData
                ? new File(new File(localAppData, 'QuietGrid'), 'Signing')
                : new File(System.getProperty('user.home'), '.quietgrid-signing')
def signingProperties = new Properties()
def signingPropertiesFile = new File(signingDirectory, 'signing.properties')
if (unsignedRelease == null && signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def legalAssets = tasks.register('prepareLegalAssets', Sync) {
    from(rootProject.projectDir) {
        include 'LICENSE', 'PRIVACY.md', 'THIRD_PARTY_NOTICES.md', 'licenses/*.txt'
    }
    into layout.buildDirectory.dir('generated/legalAssets/legal')
}

def requireReleaseSigning = tasks.register('requireReleaseSigning') {
    doLast {
        if (!signingPropertiesFile.exists() ||
                ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !signingProperties.getProperty(it) } ||
                !new File(signingDirectory, signingProperties.getProperty('storeFile')).isFile()) {
            throw new GradleException('Private release signing is missing or incomplete. See docs/DEVELOPMENT.md; an unsigned release will not be distributed.')
        }
    }
}

android {
    namespace 'com.quietgrid.sudoku'
    compileSdk 36
    buildToolsVersion '36.0.0'
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'

    defaultConfig {
        applicationId 'fyi.mllab.puzzle'
        minSdk 29
        targetSdk 36
        versionCode 9
        versionName '1.1.6'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        manifestPlaceholders = [appLabel: '@string/app_name']
        buildConfigField 'boolean', 'LOCAL_PUZZLE_SHARING', 'false'
        buildConfigField 'String', 'PUZZLE_LINK_SCHEME', '""'
    }
    testBuildType 'validation'

    signingConfigs {
        release {
            if (unsignedRelease == null && signingPropertiesFile.exists()) {
                storeFile new File(signingDirectory, signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        validation {
            initWith debug
            applicationIdSuffix '.validation'
            manifestPlaceholders = [appLabel: 'Liddle Puzzles validation']
            manifestPlaceholders.puzzleLinkScheme = 'liddlepuzzles-local'
            buildConfigField 'boolean', 'LOCAL_PUZZLE_SHARING', 'true'
            buildConfigField 'String', 'PUZZLE_LINK_SCHEME', '"liddlepuzzles-local"'
        }
        release {
            debuggable false
            manifestPlaceholders.puzzleLinkScheme = 'liddlepuzzles'
            buildConfigField 'boolean', 'LOCAL_PUZZLE_SHARING', 'true'
            buildConfigField 'String', 'PUZZLE_LINK_SCHEME', '"liddlepuzzles"'
            signingConfig unsignedRelease == 'true' ? null : signingConfigs.release
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/legalAssets')
    sourceSets.validation.manifest.srcFile 'src/sharing/AndroidManifest.xml'
    sourceSets.release.manifest.srcFile 'src/sharing/AndroidManifest.xml'
    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    tasks.configureEach {
        if (name == 'preReleaseBuild' && unsignedRelease == null) {
            dependsOn requireReleaseSigning
        }
        if ((name.startsWith('merge') && name.endsWith('Assets')) || name.toLowerCase().contains('lint')) {
            dependsOn legalAssets
        }
    }
    lint {
        abortOnError true
    }
}
